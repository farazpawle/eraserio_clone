# Run with: docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
services:
  eraser:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: eraser
    restart: unless-stopped
    env_file: .env.prod
    ports:
      # Docker bridge gateway: reachable by Nginx Proxy Manager, not from the internet.
      - "10.0.0.1:8091:3000"
